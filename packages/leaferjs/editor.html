<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导出元素</title>
</head>

<body>
    <script type="importmap">
        {
            "imports": {
                "leafer-ui": "/node_modules/leafer-ui/dist/web.esm.js",
                "@leafer-ui/draw": "/node_modules/@leafer-ui/draw/lib/draw.esm.js",
                "@leafer-ui/core": "/node_modules/@leafer-ui/core/lib/core.esm.js",
                "@leafer-in/export": "/node_modules/@leafer-in/export/dist/export.esm.js",
                "@leafer-in/editor": "/node_modules/@leafer-in/editor/dist/editor.esm.js",
                "@leafer-in/viewport": "/node_modules/@leafer-in/viewport/dist/viewport.esm.js",
                "@leafer-in/resize": "/node_modules/@leafer-in/resize/dist/resize.esm.js",
                "@leafer/core": "/node_modules/@leafer/core/lib/core.esm.js"
            }
        }
    </script>
    <script type="module">
        // #App结构 - 图形编辑器 [editor]
import { App, Frame, Rect } from 'leafer-ui'
import '@leafer-in/editor' // 导入图形编辑器插件 //
import '@leafer-in/viewport' // 导入视口插件 (可选)

const app = new App({
    view: window,
    fill: '#333',
    editor: {},  //  配置 editor 会自动创建并添加 app.editor 实例、tree 层、sky 层
})

app.tree.add(Frame.one({ // 页面内容
    children: [
        Rect.one({ editable: true, fill: '#FEB027', cornerRadius: [20, 0, 0, 20] }, 100, 100),
        Rect.one({ editable: true, fill: '#FFE04B', cornerRadius: [0, 20, 20, 0] }, 300, 100)
    ]
}, 100, 100, 500, 600))
    </script>
</body>

</html>
