<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导出元素</title>
</head>

<body>
    <script type="importmap">
        {
            "imports": {
                "leafer-ui": "/node_modules/leafer-ui/dist/web.esm.js",
                "@leafer-in/export": "/node_modules/@leafer-in/export/dist/export.esm.js",
                "@leafer-ui/draw": "/node_modules/@leafer-ui/draw/lib/draw.esm.js",
                "@leafer-ui/core": "/node_modules/@leafer-ui/core/lib/core.esm.js",
                "@leafer/core": "/node_modules/@leafer/core/lib/core.esm.js"
            }
        }
    </script>
    <script type="module">
        // #导出图片 [绘制水印]
        import { Leafer, Rect } from 'leafer-ui'
        import '@leafer-in/export' // 引入导出元素插件  

        const leafer = new Leafer({ view: window })

        const rect = Rect.one({ fill: '#32cd79' }, 100, 100)
        leafer.add(rect)


        // 创建图片水印
        const watermarkImage = new Image();
        watermarkImage.onload = () => {
            rect.export('水印.png', {
                pixelRatio: 2,
                onCanvas(canvas) {  // 通过onCanvas钩子函数绘制水印 
                    const {
                        context,  // CanvasRenderingContext2D，原生canvas上下文对象
                        pixelRatio, // 像素比
                        width, // 逻辑宽度， 获取实际像素宽度请使用 pixelWidth
                        height // 逻辑高度， 获取实际像素高度请使用 pixelHeight
                    } = canvas
                    console.log(111, context)
                    context.scale(pixelRatio, pixelRatio) // 抹平像素比差异
                    context.fillText('绘制水印11', width - 60, height - 20)
                    // 绘制图片水印，添加透明度
                    context.globalAlpha = 0.5;
                    context.drawImage(watermarkImage, width - 80, height - 80, 70, 70);
                    context.globalAlpha = 1.0; // 恢复透明度
                }
            })
        };
        // 可以使用本地图片或在线图片
        watermarkImage.src = './image/leafer.jpg'; // 使用相同的图片作为演示

    </script>
</body>

</html>
