<style>
    #container {
        width: 1000px;
        height: 500px;
    }
</style>
<body>
    <div id="container"></div>
</body>
<!--LogicFlow core包css-->
<!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@logicflow/core/dist/style/index.css" /> -->
<link rel="stylesheet" href="../node_modules/@logicflow/core/dist/style/index.css" />
<!--LogicFlow extension包css-->
<!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@logicflow/extension/lib/style/index.css" /> -->
<link rel="stylesheet" href="../node_modules/@logicflow/extension/es/style/index.css" />
<!--LogicFlow core包js-->
<script src="../node_modules/@logicflow/core/dist/logic-flow.js"></script>
<!--LogicFlow的插件支持单个引入，这里以菜单插件为例-->
<script src="../node_modules/@logicflow/extension/lib/Menu.js"></script>

<script>
    LogicFlow.use(Menu);
    const lf = new LogicFlow({
        container: document.querySelector("#container"),
        grid: true,
        plugins: [Menu],
    });
    lf.extension.menu.addMenuConfig({
        nodeMenu: [
            {
                text: "分享",
                callback() {
                    alert("分享成功！");
                },
            },
            {
                text: "属性",
                callback(node) {
                    alert(`
          节点id：${node.id}
          节点类型：${node.type}
          节点坐标：(x: ${node.x}, y: ${node.y})`);
                },
            },
        ],
        edgeMenu: [
            {
                text: "属性",
                callback(edge) {
                    alert(`
          边id：${edge.id}
          边类型：${edge.type}
          边坐标：(x: ${edge.x}, y: ${edge.y})
          源节点id：${edge.sourceNodeId}
          目标节点id：${edge.targetNodeId}`);
                },
            },
        ],
        graphMenu: [
            {
                text: "分享",
                callback() {
                    alert("分享成功！");
                },
            },
        ],
    });
    lf.render({
        nodes: [
            {
                id: "1",
                type: "rect",
                x: 100,
                y: 100,
                text: "节点1",
            },
            {
                id: "2",
                type: "circle",
                x: 300,
                y: 200,
                text: "节点2",
            },
        ],
        edges: [
            {
                sourceNodeId: "1",
                targetNodeId: "2",
                type: "polyline",
                text: "连线",
            },
        ],
    });
</script>
